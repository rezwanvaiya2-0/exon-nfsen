services:
  nfsen:
    # image name lets you docker push / docker pull instead of rebuilding
    # (~7 min source compile) on every new VPS
    image: exon-nfsen:latest
    build: .
    container_name: exon-nfsen
    hostname: nfsen
    restart: unless-stopped
    ports:
      - "8070:8070"
      # Only the UDP ports you actually use are published (2055 + 2056).
      # To open a new port for a router: add its line here, add the source to
      # NFSEN_SOURCES below, then run `docker compose up -d` (~3s, no rebuild,
      # no data loss). NEVER use `down -v` unless you want to wipe your data.
      - "2055:2055/udp"
      - "2056:2056/udp"
    volumes:
      - nfsen-data:/var/nfsen/profiles-data
      - nfsen-stat:/var/nfsen/profiles-stat
      - nfsen-var:/var/nfsen/var
    environment:
      - TZ=Asia/Dhaka
      - NFSEN_SOURCES=2055:exonhost_microtik:#0000ff
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - nfsen-net

volumes:
  nfsen-data:
    driver: local
  nfsen-stat:
    driver: local
  nfsen-var:
    driver: local

networks:
  nfsen-net:
    driver: bridge
