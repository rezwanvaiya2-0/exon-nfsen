services:
  nfsen:
    # image name lets you docker push / docker pull instead of rebuilding
    # (~7 min source compile) on every new VPS
    image: exon-nfsen:latest
    build: .
    container_name: exon-nfsen
    hostname: nfsen
    restart: unless-stopped
    ports:
      - "8070:8070"
      # 45 UDP ports (2055-2099) = up to 45 router sources.
      # WIDER ranges spawn one docker-proxy process per port - the old
      # 2055-3000 (946 ports) made the container slow to start and OOM-killed
      # it on small VPSs. Extend this range only if you truly need >45 routers.
      - "2055-2099:2055-2099/udp"
    volumes:
      - nfsen-data:/var/nfsen/profiles-data
      - nfsen-stat:/var/nfsen/profiles-stat
      - nfsen-var:/var/nfsen/var
    environment:
      - TZ=Asia/Dhaka
      - NFSEN_SOURCES=2055:exonhost_microtik:#0000ff
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - nfsen-net

volumes:
  nfsen-data:
    driver: local
  nfsen-stat:
    driver: local
  nfsen-var:
    driver: local

networks:
  nfsen-net:
    driver: bridge
